devices:
    - name: test1
      kind: router
    - name: test2
      kind: router
    - name: core
      kind: switch
    - name: office1
      kind: router
    - name: core2
      kind: switch
    - name: core_office1
      kind: switch
    - name: market-a
      kind: router
    - name: core-market-a
      kind: switch
    - name: market
      kind: router
links:
    - a:
        device: test1
      b:
        device: core
    - a:
        device: core
      b:
        device: test2
    - a:
        device: office1
      b:
        device: core_office1
    - a:
        device: test1
      b:
        device: office1
      filter:
        a-exports:
            - MAIN
        b-exports:
            - OFFICE-NETWORK
    - a:
        device: test2
      b:
        device: office1
      filter:
        a-exports:
            - MAIN
        b-exports:
            - OFFICE-NETWORK
    - a:
        device: market-a
      b:
        device: test1
      filter:
        a-exports:
            - market-a
        b-exports:
            - MAIN
    - a:
        device: market-a
      b:
        device: core-market-a
    - a:
        device: core2
      b:
        device: market
    - a:
        device: market
      b:
        device: test1
      filter:
        a-exports:
            - MARKET
        b-exports:
            - MAIN
networks:
    - name: OFFICE-NETWORK
      subnets:
        - office-net
      attach:
        - device: core_office1
    - name: MAIN
      subnets:
        - main
        - server
      attach:
        - device: core
    - name: MARKET
      subnets:
        - mr-1
      attach:
        - device: core2
    - name: market-a
      subnets:
        - market1
      attach:
        - device: core-market-a
sets: []
unions:
    - name: Главный офис
      devices:
        - office1
        - core_office1
      networks:
        - OFFICE-NETWORK
    - name: Дата-Центр
      devices:
        - core
        - test2
        - test1
      networks:
        - MAIN
    - name: Магазин
      devices:
        - core2
        - market
      networks:
        - MARKET
    - name: Магазин А
      devices:
        - core-market-a
        - market-a
      networks:
        - market-a
