devices:
    - name: test1
      kind: router
    - name: test2
      kind: router
    - name: core
      kind: switch
    - name: office1
      kind: router
    - name: zavod
      kind: router
links:
    - a:
        device: test1
      b:
        device: core
    - a:
        device: core
      b:
        device: test2
    - a:
        device: core
      b:
        device: office1
    - a:
        device: zavod
      b:
        device: core
networks:
    - name: servers
      subnets:
        - main
      attach:
        - device: test1
        - device: test2
    - name: test1
      subnets:
        - office-net
      attach:
        - device: office1
