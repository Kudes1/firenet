devices:
    - name: test1
      kind: router
    - name: test2
      kind: router
    - name: core
      kind: switch
    - name: office1
      kind: router
    - name: zavod
      kind: router
links:
    - a:
        device: test1
      b:
        device: core
    - a:
        device: core
      b:
        device: test2
    - a:
        device: core
      b:
        device: office1
    - a:
        device: zavod
      b:
        device: core
subnets:
    - name: main
      cidr: 10.10.10.0/24
      attach:
        - device: test1
        - device: test2
    - name: office-net
      cidr: 192.168.1.0/24
      attach:
        - device: office1
    - name: zv-1
      cidr: 172.20.0.0/16
      attach:
        - device: zavod
zones:
    - name: OFFICE
      subnets:
        - main
        - office-net
