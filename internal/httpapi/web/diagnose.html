<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>firenet — диагностика</title>
<script>
  try {
    var saved = localStorage.getItem("firenet-theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<style>
  #diag-canvas { inset: 0; width: 100%; height: 100%; }
  #diag-fit { position: absolute; top: var(--space-2); right: var(--space-2); z-index: 2; }
</style>
</head>
<body data-nav="diagnose" x-data="appData()" @notify.window="showBanner($event.detail.message, $event.detail.kind)">

<main>
  <div class="topology-layout">
    <div class="canvas-wrap" id="diag-wrap">
      <canvas id="diag-canvas"></canvas>
      <div class="topo-toolbar">
        <button id="diag-tool-path" class="tool" title="Диагностика пути" aria-label="Диагностика пути">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5" cy="6" r="2"/>
            <circle cx="19" cy="18" r="2"/>
            <path d="M7 6h6a4 4 0 0 1 4 4v2a4 4 0 0 0 4 4h-2"/>
          </svg>
        </button>
        <button id="diag-tool-spread" class="tool" title="Распространение сети" aria-label="Распространение сети">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>
            <path d="M8.5 8.5a5 5 0 0 1 7 0"/>
            <path d="M5.5 5.5a9 9 0 0 1 13 0"/>
          </svg>
        </button>
        <span class="toolbar-sep"></span>
        <button id="diag-tool-reset" class="tool" title="Сбросить результаты диагностики" aria-label="Сбросить результаты диагностики" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
            <path d="M23 4v6h-6"/>
            <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
            <path d="M1 20v-6h6"/>
          </svg>
        </button>
      </div>
      <div id="diag-panel" class="diag-panel">
        <header id="diag-panel-header" class="diag-panel-header">
          <strong>Диагностика пути</strong>
          <button type="button" id="diag-panel-close" class="diag-panel-close" title="Закрыть" aria-label="Закрыть">&times;</button>
        </header>
        <div class="diag-panel-body">
          <form id="diag-form">
            <label>Источник (IP)
              <input id="diag-src" placeholder="10.0.0.5" autocomplete="off" spellcheck="false" required>
            </label>
            <label>Назначение (IP)
              <input id="diag-dst" placeholder="10.0.1.7" autocomplete="off" spellcheck="false" required>
            </label>
            <label>Протокол
              <select id="diag-proto">
                <option value="">любой</option>
                <option value="tcp">tcp</option>
                <option value="udp">udp</option>
                <option value="icmp">icmp</option>
              </select>
            </label>
            <label>Порты назначения (через запятую)
              <input id="diag-dstports" placeholder="443, 8080" autocomplete="off" spellcheck="false">
            </label>
            <button type="submit" class="primary">Диагностировать</button>
          </form>
          <section id="diag-summary" hidden></section>
          <section id="diag-paths"></section>
        </div>
      </div>
      <div id="spread-panel" class="diag-panel" hidden>
        <header id="spread-panel-header" class="diag-panel-header">
          <strong>Распространение сети</strong>
          <button type="button" id="spread-panel-close" class="diag-panel-close" title="Закрыть" aria-label="Закрыть">&times;</button>
        </header>
        <div class="diag-panel-body">
          <form id="spread-form">
            <label>Источник (сеть, подсеть или IP)
              <div class="member-combo diag-combo" id="spread-combo">
                <input id="spread-src" placeholder="office, 10.0.0.0/24 или 10.0.0.5" autocomplete="off" spellcheck="false" required title="Сети и подсети; ввод фильтрует по имени, CIDR или IP внутри подсети">
                <button type="button" id="spread-clear" class="member-clear" title="Очистить поле" aria-label="Очистить поле" hidden>
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8"/><path d="M12 4L4 12"/></svg>
                </button>
                <button type="button" id="spread-toggle" class="member-combo-toggle" title="Показать или скрыть список" aria-label="Показать или скрыть список">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
                </button>
                <div id="spread-suggestions" class="member-suggestions" hidden></div>
              </div>
            </label>
            <button type="submit" class="primary">Показать распространение</button>
          </form>
          <section id="spread-summary" hidden></section>
        </div>
      </div>
      <div id="net-info" class="net-info" hidden></div>
      <button id="diag-fit" title="Вписать карту">Вписать</button>
      <div id="diag-tooltip" class="diag-tooltip" hidden></div>
      <canvas id="diag-minimap" class="diag-minimap" hidden></canvas>
    </div>
  </div>
</main>

<script type="module" src="/common.js"></script>
<script type="module" src="/camera.js"></script>
<script type="module" src="/minimap.js"></script>
<script type="module" src="/camera_input.js"></script>
<script type="module" src="/netmap.js"></script>
<script src="/tween.js"></script>
<script src="/canvas_theme.js"></script>
<script src="/hit_test.js"></script>
<script type="module" src="/canvas_view.js"></script>
<script src="/topo_scene.js"></script>
<script type="module" src="/net_info.js"></script>
<script type="module" src="/diagnose.js"></script>
<script src="/alpine.min.js" defer></script>
</body>
</html>
