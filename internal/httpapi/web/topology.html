<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>firenet — топология</title>
<script>
  try {
    var saved = localStorage.getItem("firenet-theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body data-nav="topology" x-data="appData()" @notify.window="showBanner($event.detail.message, $event.detail.kind)">

<main>
  <div class="topology-layout">
    <div class="canvas-wrap">
      <canvas id="topo-canvas"></canvas>
      <div class="topo-toolbar">
        <button id="topo-search-toggle" class="tool" title="Поиск по устройствам, сетям, подсетям (Enter — следующее совпадение)" aria-label="Поиск">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.8-3.8"/>
          </svg>
        </button>
        <input id="topo-search" hidden placeholder="поиск: имя / CIDR / IP" autocomplete="off" spellcheck="false"
               title="Поиск по устройствам, сетям, подсетям (Enter — следующее совпадение)" aria-label="Поиск по топологии">
        <span class="toolbar-sep"></span>
        <button id="topo-delete" class="tool danger" disabled title="Удалить выбранное (Del)" aria-label="Удалить выбранное">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
          </svg>
        </button>
        <span class="toolbar-sep"></span>
        <button id="tool-select" class="tool" title="Выбор и перемещение (V)" aria-label="Выбор">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 8-6 1.6L9.4 19z"/></svg>
        </button>
        <button id="tool-connect" class="tool" title="Соединить устройства/сети (C)" aria-label="Связь">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M7 12c3-6 7 6 10 0"/>
            <circle cx="4" cy="12" r="2" fill="currentColor" stroke="none"/>
            <circle cx="20" cy="12" r="2" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <button id="tool-device" class="tool" title="Добавить устройство (D)" aria-label="Устройство">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="5" y="3" width="14" height="18" rx="1.5"/>
            <path d="M5 9h14M5 15h14"/>
            <circle cx="8" cy="6" r="0.6" fill="currentColor"/><circle cx="11" cy="6" r="0.6" fill="currentColor"/>
            <circle cx="8" cy="12" r="0.6" fill="currentColor"/><circle cx="11" cy="12" r="0.6" fill="currentColor"/>
            <circle cx="8" cy="18" r="0.6" fill="currentColor"/><circle cx="11" cy="18" r="0.6" fill="currentColor"/>
          </svg>
        </button>
        <button id="tool-network" class="tool" title="Добавить сеть (N)" aria-label="Сеть">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19a4.5 4.5 0 0 0 .34-8.99A6 6 0 0 0 6.2 11.6 4 4 0 0 0 7 19z"/>
          </svg>
        </button>
        <span class="toolbar-sep"></span>
        <button id="topo-fit" class="tool" title="Вписать карту в окно" aria-label="Вписать карту">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m15-5h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3m15 5h3a2 2 0 0 0 2-2v-3"/>
          </svg>
        </button>
        <span class="toolbar-sep"></span>
        <span id="topo-sync-status" class="sync-status saved" role="status" aria-live="polite"
              data-status="saved" aria-label="Сохранено" title="Сохранено">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/>
          </svg>
        </span>
      </div>
      <div id="node-popover" class="node-popover" hidden>
        <form id="node-name-form">
          <input id="node-name-input" placeholder="имя" autocomplete="off">
          <select id="node-kind-select">
            <option value="router">router</option>
            <option value="switch">switch</option>
          </select>
          <button type="submit">OK</button>
        </form>
      </div>
      <div id="topo-context-menu" class="context-menu" hidden></div>
      <div id="net-info" class="net-info" hidden></div>
      <div id="link-panel" class="link-panel" hidden></div>
      <div id="device-edit" class="net-edit" x-data="devicesPage" x-ref="deviceEdit" hidden>
        <header id="device-edit-header" class="net-edit-header">
          <h3 class="net-edit-title">Изменить устройство</h3>
          <button type="button" id="device-edit-close" class="net-edit-close" title="Закрыть" aria-label="Закрыть">×</button>
        </header>
        <div class="net-edit-body">
          <label>Имя
            <input x-model.trim="draft.name" placeholder="r1">
          </label>
          <label>Объединение
            <select x-model="draft.union">
              <option value="">— без объединения —</option>
              <template x-for="u in unions" :key="u.name">
                <option :value="u.name" x-text="u.name"></option>
              </template>
            </select>
          </label>
          <label>Описание
            <textarea x-model.trim="draft.description" rows="3" placeholder="Заметка об устройстве"></textarea>
          </label>
          <p class="cell-hint" x-show="draftHint" x-text="draftHint"></p>
          <div class="modal-actions">
            <button type="button" @click="closeDeviceEdit()">Отмена</button>
            <button type="button" class="primary" :disabled="!!draftHint || saving" @click="saveDraft()">Сохранить</button>
          </div>
        </div>
      </div>
      <div id="net-edit" class="net-edit" x-data="networksPage" x-ref="netEdit" hidden>
        <header id="net-edit-header" class="net-edit-header">
          <h3 class="net-edit-title">Изменить сеть</h3>
          <button type="button" id="net-edit-close" class="net-edit-close" title="Закрыть" aria-label="Закрыть">×</button>
        </header>
        <div class="net-edit-body">
          <label>Имя
            <input x-model.trim="draft.name" placeholder="office">
          </label>
          <label>Описание
            <textarea x-model.trim="draft.description" rows="3" placeholder="Заметка о сети"></textarea>
          </label>
          <label>Подсети</label>
          <div class="member-list">
            <template x-for="s in draft.subnets" :key="s">
              <div class="member-row">
                <span class="owner-badge" x-text="s"></span>
                <span class="hint" x-text="cidrOf(s)"></span>
                <button type="button" class="icon-btn delete" title="Убрать подсеть из сети" @click="removeMember(s)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11"/><path d="M5.5 4V2.7c0-.4.3-.7.7-.7h3.6c.4 0 .7.3.7.7V4"/><path d="M3.5 4l.6 9.3c0 .4.4.7.8.7h6.2c.4 0 .8-.3.8-.7L12.5 4"/><path d="M6.5 6.8v4.4"/><path d="M9.5 6.8v4.4"/></svg></button>
              </div>
            </template>
            <p class="hint member-empty" x-show="!draft.subnets.length">Подсети не добавлены</p>
          </div>
          <div class="member-add">
            <div class="member-combo" @click.outside="memberOpen = false">
              <input x-model.trim="memberSearch" placeholder="все подсети — начните вводить для поиска" title="Список всех доступных подсетей; ввод фильтрует его по имени или CIDR" @focus="memberOpen = true" @click="memberOpen = true" @input="memberOpen = true; memberCursor = 0" @keydown.arrow-down.prevent="moveCursor(1)" @keydown.arrow-up.prevent="moveCursor(-1)" @keydown.enter.prevent="pickCursor()" @keydown.escape="memberOpen = false">
              <button type="button" class="member-combo-toggle" :class="{ open: memberOpen }" @click="memberOpen = !memberOpen" title="Показать или скрыть список"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
              <div class="member-suggestions" x-show="memberOpen" x-cloak>
                <template x-for="(s, i) in availableSubnets" :key="s.name">
                  <button type="button" class="member-suggestion" :class="{ active: i === memberCursor }" @mousedown.prevent="addMember(s.name)" @mouseenter="memberCursor = i" x-text="s.name + ' (' + s.cidr + ')'"></button>
                </template>
                <p class="hint member-empty" x-show="!availableSubnets.length">Ничего не найдено</p>
              </div>
            </div>
          </div>
          <p class="cell-hint" x-show="draftHint" x-text="draftHint"></p>
          <div class="modal-actions">
            <button type="button" @click="closeNetworkEdit()">Отмена</button>
            <button type="button" class="primary" :disabled="!!draftHint || saving" @click="saveDraft()">Сохранить</button>
          </div>
        </div>
      </div>
      <div id="topo-tooltip" class="topo-tooltip" hidden></div>
      <canvas id="topo-minimap" class="topo-minimap" hidden></canvas>
    </div>
  </div>
</main>

<script type="module" src="/common.js"></script>
<script type="module" src="/topology.js"></script>
<script src="/alpine.min.js" defer></script>
</body>
</html>
