<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>firenet — топология</title>
<script>
  try {
    var saved = localStorage.getItem("firenet-theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body data-nav="topology" x-data="appData()" @notify.window="showBanner($event.detail.message, $event.detail.kind)">

<main>
  <div class="topology-layout">
    <div class="canvas-wrap">
      <canvas id="topo-canvas"></canvas>
      <div class="topo-toolbar">
        <button id="topo-search-toggle" class="tool" title="Поиск по устройствам, сетям, подсетям (Enter — следующее совпадение)" aria-label="Поиск">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.8-3.8"/>
          </svg>
        </button>
        <input id="topo-search" hidden placeholder="поиск: имя / CIDR / IP" autocomplete="off" spellcheck="false"
               title="Поиск по устройствам, сетям, подсетям (Enter — следующее совпадение)" aria-label="Поиск по топологии">
        <span class="toolbar-sep"></span>
        <button id="topo-delete" class="tool danger" disabled title="Удалить выбранное (Del)" aria-label="Удалить выбранное">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
          </svg>
        </button>
        <span class="toolbar-sep"></span>
        <button id="tool-select" class="tool" title="Выбор и перемещение (V)" aria-label="Выбор">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 8-6 1.6L9.4 19z"/></svg>
        </button>
        <button id="tool-connect" class="tool" title="Соединить устройства/сети (C)" aria-label="Связь">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M7 12c3-6 7 6 10 0"/>
            <circle cx="4" cy="12" r="2" fill="currentColor" stroke="none"/>
            <circle cx="20" cy="12" r="2" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <button id="tool-device" class="tool" title="Добавить устройство (D)" aria-label="Устройство">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="5" y="3" width="14" height="18" rx="1.5"/>
            <path d="M5 9h14M5 15h14"/>
            <circle cx="8" cy="6" r="0.6" fill="currentColor"/><circle cx="11" cy="6" r="0.6" fill="currentColor"/>
            <circle cx="8" cy="12" r="0.6" fill="currentColor"/><circle cx="11" cy="12" r="0.6" fill="currentColor"/>
            <circle cx="8" cy="18" r="0.6" fill="currentColor"/><circle cx="11" cy="18" r="0.6" fill="currentColor"/>
          </svg>
        </button>
        <button id="tool-network" class="tool" title="Добавить сеть (N)" aria-label="Сеть">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19a4.5 4.5 0 0 0 .34-8.99A6 6 0 0 0 6.2 11.6 4 4 0 0 0 7 19z"/>
          </svg>
        </button>
        <span class="toolbar-sep"></span>
        <button id="topo-fit" class="tool" title="Вписать карту в окно" aria-label="Вписать карту">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m15-5h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3m15 5h3a2 2 0 0 0 2-2v-3"/>
          </svg>
        </button>
        <span class="toolbar-sep"></span>
        <span id="topo-sync-status" class="sync-status saved" role="status" aria-live="polite"
              data-status="saved" aria-label="Сохранено" title="Сохранено">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/>
          </svg>
        </span>
      </div>
      <div id="node-popover" class="node-popover" hidden>
        <form id="node-name-form">
          <input id="node-name-input" placeholder="имя" autocomplete="off">
          <select id="node-kind-select">
            <option value="router">router</option>
            <option value="switch">switch</option>
          </select>
          <button type="submit">OK</button>
        </form>
      </div>
      <div id="topo-context-menu" class="context-menu" hidden></div>
      <div id="net-info" class="net-info" hidden></div>
      <div id="link-panel" class="link-panel" hidden></div>
      <div id="topo-tooltip" class="topo-tooltip" hidden></div>
      <canvas id="topo-minimap" class="topo-minimap" hidden></canvas>
    </div>
  </div>
</main>

<script src="/alpine.min.js" defer></script>
<script src="/common.js"></script>
<script src="/camera.js"></script>
<script src="/minimap.js"></script>
<script src="/camera_input.js"></script>
<script src="/netmap.js"></script>
<script src="/tween.js"></script>
<script src="/canvas_theme.js"></script>
<script src="/hit_test.js"></script>
<script src="/canvas_view.js"></script>
<script src="/net_info.js"></script>
<script src="/link_panel.js"></script>
<script src="/topo_scene.js"></script>
<script src="/topology_sync.js"></script>
<script src="/topology.js"></script>
</body>
</html>
