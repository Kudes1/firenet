<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>firenet — сети</title>
<script>
  try {
    var saved = localStorage.getItem("firenet-theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body data-nav="networks" x-data="appData()" @notify.window="showBanner($event.detail.message, $event.detail.kind)">
<div id="site-header"></div>

<main x-data="networksPage">
  <div class="table-toolbar">
    <div>
      <h3>Сети (списки ipset)</h3>
      <p class="hint">Сеть — именованный список подсетей, из которого при компиляции получается один ipset. Подсеть может входить только в одну сеть. Привязка сетей к устройствам — на странице «Топология».</p>
    </div>
    <div class="toolbar-actions">
      <button type="button" class="primary" @click="openAdd()">+ сеть</button>
    </div>
  </div>
  <div class="table-wrap" x-show="loaded" x-cloak>
    <table class="data-table" x-ref="table">
      <colgroup>
        <col data-default-width="220" data-min-width="120">
        <col data-default-width="520" data-min-width="200">
        <col data-default-width="100" data-min-width="80">
      </colgroup>
      <thead>
        <tr><th>Имя</th><th>Подсети</th><th></th></tr>
      </thead>
      <tbody>
        <template x-for="(net, i) in networks" :key="net.name">
          <tr>
            <td x-text="net.name"></td>
            <td>
              <template x-for="s in net.subnets" :key="s">
                <span class="owner-badge" x-text="s"></span>
              </template>
              <span class="hint" x-show="!net.subnets.length">нет подсетей</span>
            </td>
            <td>
              <button type="button" class="icon-btn edit" title="Изменить" @click="openEdit(i)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.3 2.1a1.6 1.6 0 0 1 2.3 2.3L5.4 12.6l-3.1.8.8-3.1z"/></svg></button>
              <button type="button" class="icon-btn delete" title="Удалить" @click="removeNetwork(i)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11"/><path d="M5.5 4V2.7c0-.4.3-.7.7-.7h3.6c.4 0 .7.3.7.7V4"/><path d="M3.5 4l.6 9.3c0 .4.4.7.8.7h6.2c.4 0 .8-.3.8-.7L12.5 4"/><path d="M6.5 6.8v4.4"/><path d="M9.5 6.8v4.4"/></svg></button>
            </td>
          </tr>
        </template>
        <tr x-show="loaded && !networks.length"><td colspan="3" class="empty-cell">Сетей нет — добавьте первую</td></tr>
      </tbody>
    </table>
  </div>

  <dialog x-ref="dialog" class="modal modal-lg">
    <h3 x-text="draft.index >= 0 ? 'Изменить сеть' : 'Новая сеть'"></h3>
    <label>Имя
      <input x-model.trim="draft.name" placeholder="office">
    </label>
    <label>Подсети</label>
    <div class="member-list">
      <template x-for="s in draft.subnets" :key="s">
        <div class="member-row">
          <span class="owner-badge" x-text="s"></span>
          <span class="hint" x-text="cidrOf(s)"></span>
          <button type="button" class="icon-btn delete" title="Убрать подсеть из сети" @click="removeMember(s)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11"/><path d="M5.5 4V2.7c0-.4.3-.7.7-.7h3.6c.4 0 .7.3.7.7V4"/><path d="M3.5 4l.6 9.3c0 .4.4.7.8.7h6.2c.4 0 .8-.3.8-.7L12.5 4"/><path d="M6.5 6.8v4.4"/><path d="M9.5 6.8v4.4"/></svg></button>
        </div>
      </template>
      <p class="hint member-empty" x-show="!draft.subnets.length">Подсети не добавлены</p>
    </div>
    <div class="member-add">
      <div class="member-combo" @click.outside="memberOpen = false">
        <input x-model.trim="memberSearch"
               placeholder="все подсети — начните вводить для поиска"
               title="Список всех доступных подсетей; ввод фильтрует его по имени или CIDR"
               @focus="memberOpen = true"
               @input="memberOpen = true; memberCursor = 0"
               @keydown.arrow-down.prevent="moveCursor(1)"
               @keydown.arrow-up.prevent="moveCursor(-1)"
               @keydown.enter.prevent="pickCursor()"
               @keydown.escape="memberOpen = false">
        <button type="button" class="member-combo-toggle" :class="{ open: memberOpen }" @click="memberOpen = !memberOpen" title="Показать или скрыть список">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
        </button>
        <div class="member-suggestions" x-show="memberOpen" x-cloak>
          <template x-for="(s, i) in availableSubnets" :key="s.name">
            <button type="button" class="member-suggestion" :class="{ active: i === memberCursor }"
                    @mousedown.prevent="addMember(s.name)"
                    @mouseenter="memberCursor = i"
                    x-text="s.name + ' (' + s.cidr + ')'"></button>
          </template>
          <p class="hint member-empty" x-show="!availableSubnets.length">Ничего не найдено</p>
        </div>
      </div>
    </div>
    <p class="cell-hint" x-show="draftHint" x-text="draftHint"></p>
    <div class="modal-actions">
      <button type="button" @click="closeModal()">Отмена</button>
      <button type="button" class="primary" :disabled="!!draftHint || saving" @click="saveDraft()">Сохранить</button>
    </div>
  </dialog>
</main>

<script src="/alpine.min.js" defer></script>
<script src="/common.js"></script>
<script src="/columns.js"></script>
<script src="/networks.js"></script>
</body>
</html>
