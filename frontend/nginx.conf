server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API уходит на бэкенд: браузер остаётся на одном origin с фронтендом,
  # cookie-сессия работает без CORS. Имена service-именами compose —
  # «backend», хост-nginx для этого не обязателен.
  location /api/ {
    proxy_pass http://backend:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Глубокие ссылки BrowserRouter: всё, что не файл, отдаём index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
