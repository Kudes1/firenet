# Пример проекта:
#
#            office-lan (10.10.0.0/24)
#                 |
#              edge-r1
#                 |
#              sw-core  <-- коммутатор, не управляется, только связность
#              /      \
#          core-r1 -- core-r2   (прямой резервный линк между ними)
#              \        /
#          dmz-web   dmz-db     (за коммутатором — доступны через ОБА core-роутера)
#
# core-r1 и core-r2 резервируют друг друга для трафика к dmz-web/dmz-db:
# компилятор поставит соответствующие правила на оба, а не только на один.

devices:
  - name: edge-r1
    kind: router

  - name: core-r1
    kind: router

  - name: core-r2
    kind: router

  - name: sw-core
    kind: switch

links:
  # прямой резервный линк между ядрами (не через свитч)
  - a: {device: core-r1}
    b: {device: core-r2}
  # оба ядра подключены к общему свитчу
  - a: {device: core-r1}
    b: {device: sw-core}
  - a: {device: core-r2}
    b: {device: sw-core}
  # edge-роутер офиса тоже висит на этом свитче
  - a: {device: edge-r1}
    b: {device: sw-core}

networks:
  # office-lan — сегмент за edge-r1
  - name: office
    subnets: [office-lan]
    attach:
      - {device: edge-r1}

  # dmz-web и dmz-db "висят" прямо на свитче — оба core-роутера видят их
  # как соседей по L2-сегменту, поэтому оба становятся кандидатами на путь.
  # Каждая подсеть — отдельная сеть со своей привязкой.
  - name: dmz-web-net
    subnets: [dmz-web]
    attach:
      - {device: sw-core}

  - name: dmz-db-net
    subnets: [dmz-db]
    attach:
      - {device: sw-core}

# Наборы адресов: смесь подсетей и одиночных хостов, из которой при
# компиляции получается один ipset. Используются в правилах наравне
# с сетями и подсетями. Каждый адрес должен попадать в известную подсеть.
sets:
  # всё, что ходит в интернет через edge-r1 (пример с внешними хостами)
  - name: trusted-hosts
    subnets: [office-lan]
    addresses:
      - 10.10.0.10   # админская станция
      - 10.20.0.5    # веб-сервер dmz-web

# Локации — чисто визуальные группы устройств и сетей для графа топологии.
# На компиляцию и правила не влияют. Каждый объект максимум в одной локации.
unions:
  - name: office
    description: Офис
    devices:  [edge-r1]
    networks: [office]

  - name: dc
    description: ЦОД
    devices:  [core-r1, core-r2, sw-core]
    networks: [dmz-web-net, dmz-db-net]
