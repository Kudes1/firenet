# Пример проекта:
#
#            office-lan (10.10.0.0/24)
#                 |
#              edge-r1
#                 |
#              sw-core  <-- коммутатор, не управляется, только связность
#              /      \
#          core-r1 -- core-r2   (прямой резервный линк между ними)
#              \        /
#          dmz-web   dmz-db     (за коммутатором — доступны через ОБА core-роутера)
#
# core-r1 и core-r2 резервируют друг друга для трафика к dmz-web/dmz-db:
# компилятор поставит соответствующие правила на оба, а не только на один.

devices:
  - name: edge-r1
    kind: router

  - name: core-r1
    kind: router

  - name: core-r2
    kind: router

  - name: sw-core
    kind: switch

links:
  # прямой резервный линк между ядрами (не через свитч)
  - a: {device: core-r1, interface: wan0}
    b: {device: core-r2, interface: wan0}
  # оба ядра подключены к общему свитчу
  - a: {device: core-r1, interface: sw-uplink}
    b: {device: sw-core, interface: p1}
  - a: {device: core-r2, interface: sw-uplink}
    b: {device: sw-core, interface: p2}
  # edge-роутер офиса тоже висит на этом свитче
  - a: {device: edge-r1, interface: uplink}
    b: {device: sw-core, interface: p3}

networks:
  # office-lan — сегмент за edge-r1
  - name: office
    subnets: [office-lan]
    attach:
      - {device: edge-r1, interface: lan0}

  # dmz-web и dmz-db "висят" прямо на свитче — оба core-роутера видят их
  # как соседей по L2-сегменту, поэтому оба становятся кандидатами на путь.
  # Каждая подсеть — отдельная сеть со своей привязкой.
  - name: dmz-web-net
    subnets: [dmz-web]
    attach:
      - {device: sw-core, interface: p4}

  - name: dmz-db-net
    subnets: [dmz-db]
    attach:
      - {device: sw-core, interface: p5}
