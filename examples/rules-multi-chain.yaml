# Пример политики с дополнительной цепочкой: обычный трафик office в dmz
# уходит в ограничивающую цепочку, где разрешён только HTTPS к dmz-web;
# доверенным хостам SSH к dmz-db разрешён напрямую в главной цепочке.
chains:
  - name: FIRENET-FWD
    defaultAction: deny
    chainPosition: top
    rules:
      - name: office-to-dmz-restricted
        comment: office к dmz идёт через ограничивающую цепочку
        src: [office-lan]
        dst: [dmz-web, dmz-db]
        action: jump
        jumpTo: FIRENET-RESTRICTED
      - name: trusted-to-db-ssh
        src: [trusted-hosts]
        dst: [dmz-db]
        proto: tcp
        dstPorts: ["22"]
        action: allow
  - name: FIRENET-RESTRICTED
    defaultAction: deny
    rules:
      - name: restricted-https
        comment: из ограничивающей цепочки разрешён только HTTPS к dmz-web
        src: [office-lan]
        dst: [dmz-web]
        proto: tcp
        dstPorts: ["443"]
        action: allow
